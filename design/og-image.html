<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ya Sale</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;600&display=block">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F4EBDA;
    }

    body { margin: 0; position: relative; }

    .band {
      position: absolute;
      left: 0;
      width: 1200px;
      height: 33px;
      background-image: url("../web/public/textil/franja.svg");
      background-repeat: repeat-x;
      background-size: 60px 33px;
    }

    .band-top { top: 0; }
    .band-bottom { bottom: 0; }

    .mark {
      position: absolute;
      top: 50%;
      right: -90px;
      width: 380px;
      height: 380px;
      transform: translateY(-50%);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 630px;
      padding-left: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand img {
      width: 88px;
      height: 88px;
      display: block;
    }

    .wordmark {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 1;
      color: #B5172F;
    }

    h1 {
      margin-top: 22px;
      max-width: 720px;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 60px;
      line-height: 1.05;
      color: #2A1F1A;
    }

    .lede {
      margin-top: 18px;
      max-width: 700px;
      font-family: Archivo, sans-serif;
      font-weight: 600;
      font-size: 30px;
      line-height: 1.25;
      color: #2A1F1A;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      max-width: 700px;
      margin-top: 24px;
    }

    .pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 20px;
      line-height: 1.2;
      color: #6B5E52;
      border: 2px solid #CDBFA6;
      border-radius: 999px;
      padding: 6px 16px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="band band-top"></div>
  <div class="band band-bottom"></div>
  <img class="mark" src="../web/public/textil/logo-inti.svg" alt="">
  <main class="content">
    <div class="brand">
      <img src="../web/public/textil/logo-inti.svg" alt="">
      <p class="wordmark">Ya Sale</p>
    </div>
    <h1>¿De dónde a dónde vas?</h1>
    <p class="lede">Tu viaje a cualquier punto del Perú, tramo por tramo, con la fuente y la fecha de cada dato.</p>
    <div class="pills">
      <span class="pill">Cusco → Aguas Calientes</span>
      <span class="pill">Iquitos → Nauta</span>
      <span class="pill">Lima → Sauce</span>
      <span class="pill">Arequipa → Chivay</span>
    </div>
  </main>
</body>
</html>

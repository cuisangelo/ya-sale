name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "design/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; a run on main may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yasale
          POSTGRES_PASSWORD: yasale
          POSTGRES_DB: yasale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yasale" --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://yasale:yasale@localhost:5432/yasale
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm build

  # The web deploys through Vercel's GitHub integration. The backend ships whenever main differs from
  # the image that is live, so a cancelled run never leaves a backend change undeployed.
  deploy:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::850995576375:role/ya-sale-github-deploy
          aws-region: us-east-1
      - id: live
        name: Compare main with the image that is live
        run: |
          service=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='ya-sale'].ServiceArn | [0]" --output text)
          image=$(aws apprunner describe-service --service-arn "$service" --query Service.SourceConfiguration.ImageRepository.ImageIdentifier --output text)
          live_sha="${image##*:}"
          if git cat-file -e "$live_sha^{commit}" 2>/dev/null && git diff --quiet "$live_sha" HEAD -- backend Dockerfile infra; then
            echo "Backend unchanged since live image $live_sha"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backend differs from live image $live_sha"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.live.outputs.changed == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.live.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.live.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ya-sale:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.live.outputs.changed == 'true'
        run: bash infra/release.sh "${{ steps.ecr.outputs.registry }}/ya-sale:${{ github.sha }}"
